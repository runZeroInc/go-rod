name: Webshot Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [x64, arm64]
    steps:
    - name: Enable long paths in Git 
      run: git config --global core.longpaths true

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        check-latest: true
        cache: true
  
    - name: Install dependencies
      run: go get -v ./...

    - name: Run webshot tests
      run: go test -v ./cmd/webshot/...
      env:
        WEBSHOT_BROWSER_TESTS: "true"