name: winacl Windows Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'pkg/winacl/**'
      - 'pkg/winaclx/**'
      - 'lib/launcher/os_windows.go'
      - 'lib/launcher/os_windows_acl_test.go'
      - 'lib/launcher/browser.go'
      - '.github/workflows/winacl_windows.yml'

jobs:
  winacl:
    runs-on: windows-latest
    steps:
      - name: Enable long paths in Git
        run: git config --global core.longpaths true

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build winacl packages
        run: go build ./pkg/winacl/... ./pkg/winaclx/... ./lib/launcher/...

      - name: Run winacl unit tests
        run: go test -v -count=1 ./pkg/winacl/... ./pkg/winaclx/...

      # Exercises both the icacls-based and raw Win32 ACL code paths in the
      # launcher to ensure the UseWinACLAPI flag dispatches correctly and
      # both backends produce equivalent ACLs on a real filesystem.
      - name: Run launcher ACL backend tests (icacls + winapi)
        run: >-
          go test -v -count=1
          -run "TestGrantReadExecToPackages_BothBackends|TestChownByUsername_BothBackends|TestLauncherDispatch_UseWinACLAPI|TestRunICACLS_NonexistentPath|TestGrantReadExecToPackagesICACLS_MissingPathIsNoop"
          ./lib/launcher/...

      # Stress test specifically targets the runtime.Pinner fix in
      # SetEntriesInAcl. With checkptr=2 and aggressive GC, an unpinned
      # SID pointer reached via Trustee.Name = (*uint16)(unsafe.Pointer(sid))
      # will fault inside the kernel call or trip the pointer checker.
      # Stress run with cgocheck2 experiment, which performs the deeper
      # pointer checks that were previously enabled by GODEBUG=cgocheck=2
      # (removed at runtime in newer Go releases). Combined with
      # -gcflags=all=-d=checkptr=2 and GOGC=1, an unpinned interior
      # pointer reached via Trustee.Name will fault here.
      - name: Run winacl GC stress test (race + checkptr=2 + cgocheck2)
        run: >-
          go test -v -race -count=3
          -gcflags=all=-d=checkptr=2
          -run TestApplyStressGC
          ./pkg/winacl/...
        env:
          GOGC: "1"
          GOEXPERIMENT: "cgocheck2"
